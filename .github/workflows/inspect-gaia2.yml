name: Inspect Gaia2 smoke candidates

on:
  push:
    branches:
      - agent/causal-orch-review
    paths:
      - scripts/inspect_gaia2_candidates.py
      - .github/workflows/inspect-gaia2.yml
  pull_request:
    paths:
      - scripts/inspect_gaia2_candidates.py
      - .github/workflows/inspect-gaia2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inspection dependencies
        run: python -m pip install --disable-pip-version-check datasets huggingface_hub pyarrow

      - name: Download and rank Gaia2 Search scenarios
        env:
          HF_HUB_DISABLE_XET: "1"
        run: >-
          python scripts/inspect_gaia2_candidates.py
          --config search
          --split validation
          --top 15
          --output-dir gaia2-inspection

      - name: Upload candidate report and scenario JSON files
        uses: actions/upload-artifact@v4
        with:
          name: gaia2-search-candidates
          path: gaia2-inspection
          if-no-files-found: error
          retention-days: 7
